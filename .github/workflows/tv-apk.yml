name: Build TV APK

on:
  push:
    paths: ["tv-app/**", ".github/workflows/tv-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: gradle -p tv-app assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FileToLinkTV
          path: tv-app/app/build/outputs/apk/release/*.apk
          retention-days: 30
