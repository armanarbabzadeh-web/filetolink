name: Build TV APK

on:
  push:
    paths: ["tv-app/**", ".github/workflows/tv-apk.yml"]
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Also take screenshots in an Android TV emulator"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        env:
          TV_KEYSTORE_B64: ${{ secrets.TV_KEYSTORE_B64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
        run: |
          echo "$TV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tv.jks"
          export TV_KEYSTORE="$RUNNER_TEMP/tv.jks"
          gradle -p tv-app assembleRelease --no-daemon
          mkdir -p apk && cp tv-app/app/build/outputs/apk/release/*.apk apk/TeleTVShare.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TeleTVShare
          path: apk/TeleTVShare.apk
          retention-days: 7

  screenshots:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: tv-app/ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TeleTVShare
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in Android TV emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tv-app/ci/shots.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots
          path: shots/*.png
          retention-days: 1
