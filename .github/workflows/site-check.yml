name: Video site check

# Manual: which video sites can the link helper download from on GitHub's servers?
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: helper

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: helper/requirements.txt

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pip install -U -r helper/requirements.txt

      - name: Probe sites
        working-directory: helper
        run: python sitecheck.py
