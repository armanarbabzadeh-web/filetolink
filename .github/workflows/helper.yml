name: Large file helper

# Started by the Cloudflare Worker (repository_dispatch) when a file over 20 MB
# arrives. Moves every queued large file from Telegram to Cloudflare, then exits.
on:
  repository_dispatch:
    types: [large-file]
  workflow_dispatch:

concurrency:
  group: large-file-helper
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: helper

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: helper/requirements.txt

      # yt-dlp needs a JavaScript runtime for YouTube
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pip install -U -r helper/requirements.txt

      - name: Move queued files
        working-directory: helper
        env:
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          HELPER_SECRET: ${{ secrets.HELPER_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ARVAN_ENDPOINT: https://s3.ir-central1.arvanstorage.ir
          ARVAN_REGION: ir-central1
          ARVAN_BUCKET: teletvshare-files
          ARVAN_ACCESS_KEY: ${{ secrets.ARVAN_ACCESS_KEY }}
          ARVAN_SECRET_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"; export YT_COOKIES_FILE="$RUNNER_TEMP/cookies.txt"; fi
          python main.py
