<style nonce="__NONCE__">
:root {
  --bg: #070d2b; --bg2: #0b1440; --card: rgba(18, 28, 72, .72); --card-solid: #121c48; --raise: rgba(255,255,255,.05);
  --line: rgba(255,255,255,.09); --line2: rgba(255,255,255,.16);
  --text: #eef2ff; --muted: #a9b4d8; --faint: #6f7aa6;
  --cyan: #38d6f5; --blue: #3b82f6; --purple: #8b5cf6;
  --grad: linear-gradient(135deg, #38d6f5 0%, #3b82f6 50%, #8b5cf6 100%);
  --ok: #22c55e; --bad: #ef4444; --warn: #ffb547;
  --r: 16px; --r-s: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; color: var(--text); background: var(--bg);
  background-image:
    radial-gradient(900px 500px at 100% -10%, rgba(56,214,245,.13), transparent 60%),
    radial-gradient(800px 600px at -10% 110%, rgba(139,92,246,.16), transparent 60%);
  background-attachment: fixed;
  font: 15px/1.65 Vazirmatn, "Segoe UI", Tahoma, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--cyan); }
.hidden { display: none !important; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 18px 16px 40px; }
.ltr { direction: ltr; unicode-bidi: embed; }
.muted { color: var(--muted); }
.faint { color: var(--faint); font-size: 12.5px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.pad { padding: 18px; }

/* header */
header.bar { position: sticky; top: 0; z-index: 10; background: rgba(7,13,43,.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
header.bar .wrap { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-decoration: none; color: inherit; cursor: pointer; }
.brand img { width: 38px; height: 38px; border-radius: 10px; }
.brand b { font-size: 16px; display: block; line-height: 1.2; }
.brand span { font-size: 12px; color: var(--muted); }
.chip-user { font-size: 13px; color: var(--muted); padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line2); background: var(--raise);
  border-radius: var(--r-s); padding: 8px 15px; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--text);
  transition: background .15s, border-color .15s, transform .1s, opacity .15s; }
.btn:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.28); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.btn.primary { background: var(--grad); border-color: transparent; color: #061027; font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.on { background: rgba(56,214,245,.16); border-color: var(--cyan); color: var(--cyan); }
.btn.danger { color: #ff8a8a; border-color: rgba(239,68,68,.35); }
.btn.danger:hover { background: rgba(239,68,68,.15); border-color: var(--bad); }
.btn.small { padding: 4px 11px; font-size: 13px; border-radius: 8px; }
.btn.icon { padding: 7px; width: 36px; height: 36px; }
.btn svg { width: 17px; height: 17px; flex: none; }

/* auth */
.auth { max-width: 400px; margin: 8vh auto 0; text-align: center; }
.auth .logo { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 10px 40px rgba(56,214,245,.25); margin-bottom: 14px; }
.auth h2 { margin: 0 0 4px; font-size: 21px; }
.auth p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
.auth form { text-align: right; }
label.f { display: block; margin-bottom: 13px; font-size: 13.5px; }
label.f span { display: block; margin-bottom: 5px; color: var(--muted); }
.in { width: 100%; padding: 10px 13px; border: 1px solid var(--line2); border-radius: var(--r-s); background: rgba(3,8,30,.55); outline: none; transition: border-color .15s, box-shadow .15s; }
.in:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(56,214,245,.15); }
input.ltr { text-align: left; }
select.in { width: auto; cursor: pointer; }
select.in option { background: var(--card-solid); }
.msg { min-height: 22px; font-size: 13.5px; color: #ff8a8a; margin: 2px 0 10px; }
.auth .btn.primary { width: 100%; padding: 11px; }

/* overview */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.tile { padding: 14px 16px; position: relative; overflow: hidden; }
.tile .k { color: var(--muted); font-size: 12.5px; }
.tile .v { font-size: 22px; font-weight: 800; margin-top: 2px; }
.tile .s { color: var(--faint); font-size: 12px; }
.tile::after { content: ""; position: absolute; inset: auto -30px -40px auto; width: 110px; height: 110px; border-radius: 50%; background: var(--grad); opacity: .12; }
@media (max-width: 820px) { .tiles { grid-template-columns: repeat(2, 1fr); } .tile .v { font-size: 19px; } }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.search { position: relative; flex: 1 1 260px; }
.search svg { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); width: 17px; height: 17px; color: var(--faint); pointer-events: none; }
.search .in { padding-right: 38px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--raise); border-radius: 999px; padding: 4px 13px; font-size: 13px; cursor: pointer; color: var(--muted); transition: all .15s; }
.chip:hover { color: var(--text); border-color: var(--line2); }
.chip.on { background: rgba(56,214,245,.14); border-color: var(--cyan); color: var(--cyan); }
.chip .n { opacity: .7; margin-inline-start: 4px; }
.count { color: var(--faint); font-size: 12.5px; margin: 0 4px 8px; }

/* users table */
table.users { width: 100%; border-collapse: collapse; }
table.users th, table.users td { padding: 11px 14px; text-align: right; vertical-align: middle; }
table.users th { font-size: 12px; color: var(--faint); font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap; border-bottom: 1px solid var(--line); }
table.users th.sorted { color: var(--cyan); }
table.users th.sorted::after { content: " ▾"; }
table.users th.sorted.asc::after { content: " ▴"; }
table.users tbody tr { cursor: pointer; transition: background .12s; }
table.users tbody tr + tr td { border-top: 1px solid var(--line); }
table.users tbody tr:hover { background: rgba(56,214,245,.06); }
.who { display: flex; align-items: center; gap: 11px; min-width: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; color: #061027; font-size: 15px; }
.avatar.big { width: 64px; height: 64px; font-size: 26px; }
.who .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; background: rgba(255,255,255,.07); color: var(--muted); }
.badge.ok { background: rgba(34,197,94,.15); color: #5be38b; }
.badge.bad { background: rgba(239,68,68,.16); color: #ff8a8a; }
.badge.warn { background: rgba(255,181,71,.15); color: var(--warn); }
.badge.acc { background: rgba(139,92,246,.2); color: #c4b1ff; }
.badge.cyan { background: rgba(56,214,245,.15); color: var(--cyan); }
.meter { height: 6px; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; margin-top: 5px; min-width: 90px; }
.meter > i { display: block; height: 100%; background: var(--grad); border-radius: 4px; }
.meter.full > i { background: var(--bad); }
.empty { text-align: center; color: var(--muted); padding: 46px 10px; }
.empty svg { width: 42px; height: 42px; color: var(--faint); display: block; margin: 0 auto 8px; }
.spin { padding: 50px; text-align: center; color: var(--muted); }
.spin::before { content: ""; display: block; width: 28px; height: 28px; margin: 0 auto 10px; border-radius: 50%; border: 3px solid rgba(255,255,255,.12); border-top-color: var(--cyan); animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

@media (max-width: 780px) {
  table.users thead { display: none; }
  table.users, table.users tbody, table.users tr, table.users td { display: block; width: 100%; }
  table.users tr { padding: 13px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
  table.users tbody tr + tr td { border-top: none; }
  table.users tbody tr + tr { border-top: 1px solid var(--line); }
  table.users td { padding: 0; }
  table.users td.c-name { grid-column: 1; }
  table.users td.c-plan { grid-column: 2; grid-row: 1; text-align: left; }
  table.users td.c-space { grid-column: 1 / -1; margin-top: 6px; }
  table.users td.c-extra { grid-column: 1 / -1; }
  table.users td.c-wide { display: none; }
}
@media (min-width: 781px) { td.c-extra { display: none; } }

/* user page */
.back { margin-bottom: 14px; }
.hero { display: flex; flex-wrap: wrap; gap: 16px 20px; align-items: center; margin-bottom: 14px; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--grad); }
.hero .id { flex: 1 1 240px; min-width: 0; }
.hero h2 { margin: 0; font-size: 21px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hero .space { flex: 1 1 260px; }
.hero .space .nums { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.hero .space .meter { height: 9px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { padding: 12px 14px; }
.stat .k { color: var(--faint); font-size: 12px; }
.stat .v { font-weight: 700; margin-top: 2px; }
.section { margin-bottom: 14px; }
.section h3 { font-size: 15.5px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.section h3 .badge { font-weight: 400; }
.acts { display: flex; flex-wrap: wrap; gap: 14px 22px; }
.acts .grp { display: flex; flex-direction: column; gap: 7px; }
.acts .grp > span { font-size: 12px; color: var(--faint); }
.acts .row { display: flex; flex-wrap: wrap; gap: 7px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r-s); overflow: hidden; }
.seg .btn { border: none; border-radius: 0; background: transparent; }
.seg .btn + .btn { border-inline-start: 1px solid var(--line2); }
.seg .btn.on { background: rgba(56,214,245,.16); }

/* files grid (like the TV app) */
.ftools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.ftools .chips { margin: 0; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
@media (max-width: 520px) { .files { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
.fcard { position: relative; border-radius: 14px; overflow: hidden; background: var(--card-solid); border: 1px solid var(--line); cursor: pointer;
  transition: transform .15s, border-color .15s, box-shadow .15s; outline: none; }
.fcard:hover, .fcard:focus-visible { transform: translateY(-3px); border-color: rgba(56,214,245,.55); box-shadow: 0 12px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(56,214,245,.25); }
.thumb { position: relative; aspect-ratio: 16 / 10; background: #0a1238; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.fcard:hover .thumb img { transform: scale(1.05); }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; }
.thumb .ph svg { width: 40%; max-width: 64px; height: auto; color: rgba(255,255,255,.9); filter: drop-shadow(0 4px 12px rgba(0,0,0,.3)); }
.ph.video { background: linear-gradient(135deg, #1d4ed8, #7c3aed); }
.ph.image { background: linear-gradient(135deg, #0891b2, #2563eb); }
.ph.audio { background: linear-gradient(135deg, #7c3aed, #db2777); }
.ph.file { background: linear-gradient(135deg, #334155, #1e293b); }
.thumb .shade { position: absolute; inset: auto 0 0 0; height: 55%; background: linear-gradient(transparent, rgba(0,0,0,.65)); pointer-events: none; }
.thumb .play { position: absolute; top: 50%; left: 50%; width: 46px; height: 46px; transform: translate(-50%,-50%) scale(.85); border-radius: 50%;
  background: rgba(7,13,43,.6); backdrop-filter: blur(4px); display: grid; place-items: center; opacity: 0; transition: opacity .15s, transform .15s; }
.thumb .play svg { width: 20px; height: 20px; color: #fff; margin-left: 3px; }
.fcard:hover .play { opacity: 1; transform: translate(-50%,-50%) scale(1); }
.ov { position: absolute; display: flex; gap: 5px; }
.ov.tl { top: 8px; left: 8px; } .ov.tr { top: 8px; right: 8px; } .ov.bl { bottom: 8px; left: 8px; } .ov.br { bottom: 8px; right: 8px; }
.pill { font-size: 11.5px; padding: 1px 8px; border-radius: 6px; background: rgba(0,0,0,.62); color: #fff; backdrop-filter: blur(4px); white-space: nowrap; }
.pill.st-arvan { background: rgba(8,145,178,.85); } .pill.st-cf { background: rgba(234,88,12,.85); } .pill.st-vps { background: rgba(124,58,237,.85); }
.pill.bad { background: rgba(239,68,68,.9); } .pill.warn { background: rgba(217,119,6,.9); }
.fbody { padding: 9px 11px 11px; }
.fname { text-align: start; font-size: 13.5px; font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; min-height: 2.9em; }
.fmeta { font-size: 12px; color: var(--faint); margin-top: 3px; display: flex; justify-content: space-between; gap: 6px; }
.fdel { position: absolute; top: 8px; left: 8px; width: 30px; height: 30px; border-radius: 8px; border: none; background: rgba(0,0,0,.55); color: #ffb4b4;
  display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .15s, background .15s; }
.fdel svg { width: 15px; height: 15px; }
.fcard:hover .fdel, .fcard:focus-within .fdel { opacity: 1; }
.fdel:hover { background: rgba(239,68,68,.9); color: #fff; }
@media (hover: none) { .fdel { opacity: 1; } }

/* payments */
.plist { display: flex; flex-direction: column; }
.prow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 2px; }
.prow + .prow { border-top: 1px solid var(--line); }
.prow .amt { font-weight: 700; margin-inline-start: auto; }

/* viewer + dialogs + toast */
.veil { position: fixed; inset: 0; background: rgba(3,6,22,.78); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 40; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.dialog { max-width: 420px; width: 100%; padding: 20px; background: var(--card-solid); }
.dialog p { margin: 0 0 18px; }
.dialog .row { display: flex; gap: 8px; }
.viewer { width: min(1100px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--card-solid); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.viewer .stage { background: #000; display: grid; place-items: center; min-height: 200px; max-height: calc(100vh - 190px); }
.viewer .stage video, .viewer .stage img { max-width: 100%; max-height: calc(100vh - 190px); display: block; }
.viewer .stage audio { width: min(520px, 90%); margin: 40px 0; }
.viewer .stage .ph { width: 100%; aspect-ratio: 16 / 7; display: grid; place-items: center; }
.viewer .stage .ph svg { width: 70px; height: 70px; color: #fff; }
.viewer .info { padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.viewer .info .t { flex: 1 1 260px; min-width: 0; }
.viewer .info .t b { display: block; word-break: break-word; }
.viewer .close { position: absolute; top: 14px; left: 14px; z-index: 41; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #eef2ff; color: #0b1440; font-weight: 600;
  padding: 10px 20px; border-radius: 999px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: up .2s; }
.toast.bad { background: var(--bad); color: #fff; }
@keyframes up { from { transform: translate(-50%, 10px); opacity: 0; } }
</style>

  try {
    await api('/credentials', { current: f.current.value, username: f.username.value.trim(), password: f.password.value });
    f.reset(); toast('نام کاربری و رمز ذخیره شد'); boot();
  } catch (err) { msg.textContent = err.code === 'login' ? 'نشست تمام شده؛ دوباره وارد شوید.' : err.message; if (err.status === 401) show('login'); }
  finally { btn.disabled = false; }
});
$('#logout').addEventListener('click', async () => {
  try { await api('/logout', {}); } catch {}
  state.users = []; state.me = null; location.hash = ''; show('login');
});

// ---------- user list
async function loadUsers() {
  $('#rows').replaceChildren(h('tr', {}, h('td', { colspan: 7, class: 'spin' }, 'در حال بارگذاری…')));
  try { state.users = await api('/users'); renderList(); }
  catch (err) { toast(err.message, true); $('#rows').replaceChildren(); }
}
const paidNow = (u) => u.plan !== 'free' && u.expires_at > Date.now();
function renderTiles() {
  const us = state.users.filter((u) => !u.admin);
  const day = Date.now() - 864e5;
  const tile = (k, v, s) => h('div', { class: 'card tile' }, h('div', { class: 'k' }, k), h('div', { class: 'v' }, v), h('div', { class: 's' }, s));
  $('#tiles').replaceChildren(
    tile('کاربران', fa(us.length), `${fa(us.filter((u) => (u.last_seen || 0) > day).length)} نفر فعال در ۲۴ ساعت`),
    tile('اشتراک فعال', fa(us.filter(paidNow).length), `${fa(us.filter((u) => u.banned).length)} کاربر مسدود`),
    tile('تلویزیون وصل', fa(us.filter((u) => u.tv).length), `از ${fa(us.length)} کاربر`),
    tile('فضای مصرفی کاربران', size(us.reduce((a, u) => a + (u.used || 0), 0)), `${fa(us.reduce((a, u) => a + (u.files || 0), 0))} فایل`),
  );
}
const SORTERS = {
  name: (u) => (u.first_name || u.username || String(u.id)).toLocaleLowerCase('fa'),
  plan: (u) => (u.quota == null ? Infinity : u.quota),
  used: (u) => u.used, files: (u) => u.files, tv: (u) => (u.tv ? 1 : 0),
  created_at: (u) => u.created_at || 0, last_seen: (u) => u.last_seen || u.created_at || 0,
  expires_at: (u) => u.expires_at || 0,
};
function filtered() {
  const q = state.q.trim().toLowerCase().replace(/^@/, '');
  const qn = q.replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const list = state.users.filter((u) => {
    if (state.filter === 'paid' && !paidNow(u)) return false;
    if (state.filter === 'free' && (paidNow(u) || u.admin)) return false;
    if (state.filter === 'tv' && !u.tv) return false;
    if (state.filter === 'banned' && !u.banned) return false;
    if (!q) return true;
    return (u.first_name || '').toLowerCase().includes(q) || (u.username || '').toLowerCase().includes(q) || String(u.id).includes(qn);
  });
  const key = SORTERS[state.sort] || SORTERS.last_seen;
  list.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * (state.asc ? 1 : -1); });
  return list;
}
function renderList() {
  renderTiles();
  const list = filtered();
  $('#count').textContent = `${fa(list.length)} از ${fa(state.users.length)} کاربر`;
  $('#none').classList.toggle('hidden', list.length > 0);
  document.querySelectorAll('table.users th').forEach((th) => {
    th.classList.toggle('sorted', th.dataset.s === state.sort);
    th.classList.toggle('asc', th.dataset.s === state.sort && state.asc);
  });
  if ([...$('#sort').options].some((o) => o.value === state.sort)) $('#sort').value = state.sort;
  $('#dir').textContent = state.asc ? 'صعودی' : 'نزولی';
  const go = (u) => () => { location.hash = '#/u/' + u.id; };
  $('#rows').replaceChildren(...list.map((u) => h('tr', { tabindex: 0, onclick: go(u), onkeydown: (e) => { if (e.key === 'Enter') go(u)(); } },
    h('td', { class: 'c-name' }, h('div', { class: 'who' }, avatar(u),
      h('div', { style: null }, h('div', { class: 'name' }, userName(u), u.banned ? ' ' : '', u.banned ? h('span', { class: 'badge bad' }, 'مسدود') : null),
        h('div', { class: 'faint' }, u.username ? h('span', { class: 'ltr' }, '@' + u.username) : null, u.username ? ' · ' : '', h('span', { class: 'ltr' }, String(u.id)))))),
    h('td', { class: 'c-plan' }, planBadge(u), u.expires_at ? h('div', { class: 'faint' }, 'تا ' + date(u.expires_at)) : null),
    h('td', { class: 'c-space' }, h('div', { class: 'faint' }, `${size(u.used)} از ${size(u.quota)}`), meter(u.used, u.quota)),
    h('td', { class: 'c-wide' }, fa(u.files)),
    h('td', { class: 'c-wide' }, u.tv ? h('span', { class: 'badge cyan' }, 'وصل') : h('span', { class: 'faint' }, '—')),
    h('td', { class: 'c-wide faint' }, date(u.created_at)),
    h('td', { class: 'c-wide faint' }, ago(u.last_seen || u.created_at)),
    h('td', { class: 'c-extra faint' }, `${fa(u.files)} فایل · ${u.tv ? 'تلویزیون وصل · ' : ''}فعالیت: ${ago(u.last_seen || u.created_at)}`),
  )));
}
$('#q').addEventListener('input', (e) => { state.q = e.target.value; renderList(); });
$('#sort').addEventListener('change', (e) => { state.sort = e.target.value; state.asc = e.target.value === 'name'; renderList(); });
$('#dir').addEventListener('click', () => { state.asc = !state.asc; renderList(); });
$('#reload').addEventListener('click', loadUsers);
document.querySelectorAll('table.users th').forEach((th) => th.addEventListener('click', () => {
  if (state.sort === th.dataset.s) state.asc = !state.asc; else { state.sort = th.dataset.s; state.asc = th.dataset.s === 'name'; }
  renderList();
}));
$('#chips').addEventListener('click', (e) => {
  const c = e.target.closest('.chip'); if (!c) return;
  state.filter = c.dataset.f;
  document.querySelectorAll('#chips .chip').forEach((x) => x.classList.toggle('on', x === c));
  renderList();
});

// ---------- one user
let current = null;
async function openUser(id) {
  show('user');
  const v = $('#v-user');
  if (!current || current.id !== id) { state.fkind = 'all'; v.replaceChildren(h('div', { class: 'spin' }, 'در حال بارگذاری…')); window.scrollTo(0, 0); }
  try { renderUser(await api('/users/' + id)); }
  catch (err) { v.replaceChildren(backBtn(), h('div', { class: 'card pad empty' }, err.message)); }
}
const backBtn = () => h('button', { class: 'btn back', onclick: () => { location.hash = ''; } }, '→ همه‌ی کاربران');
const stat = (k, ...v) => h('div', { class: 'card stat' }, h('div', { class: 'k' }, k), h('div', { class: 'v' }, ...v));

async function act(u, action, text, danger) {
  if (!(await confirmBox(text, 'بله، انجام شود', danger))) return;
  try { const r = await api(`/users/${u.id}/action`, { action }); toast(r.note || 'انجام شد'); renderUser(r.user); }
  catch (err) { toast(err.message, true); }
}
async function delFile(u, f, after) {
  if (!(await confirmBox(`فایل «${f.name}» (${size(f.size)}) برای همیشه حذف شود؟ از فضای ذخیره و تلویزیون کاربر هم پاک می‌شود.`, 'حذف', true))) return;
  try { const r = await api(`/users/${u.id}/files/${f.id}/delete`, {}); toast(r.note); after && after(); renderUser(r.user); }
  catch (err) { toast(err.message, true); }
}

// "Film part 5.mp4" -> ["Film part 5", "MP4"]: the extension goes on the picture, so names read cleanly in RTL.
function splitName(name) {
  const m = /^(.+)\.([A-Za-z0-9]{1,5})$/.exec(name || '');
  return m ? [m[1], m[2].toUpperCase()] : [name || '', ''];
}
function thumbBox(f) {
  const kind = KIND[f.kind] ? f.kind : 'file';
  const src = f.thumb || (kind === 'image' ? f.url : null);
  const ph = h('div', { class: 'ph ' + kind }, icon(kind));
  if (!src) return [ph];
  const img = h('img', { alt: '', loading: 'lazy', decoding: 'async', referrerpolicy: 'no-referrer', src });
  img.addEventListener('error', () => img.replaceWith(ph));
  return [img];
}
function fileCard(u, f) {
  const kind = KIND[f.kind] ? f.kind : 'file';
  const ready = f.status === 'ready';
  const del = h('button', { class: 'fdel', title: 'حذف', 'aria-label': 'حذف فایل', disabled: !['ready', 'failed'].includes(f.status),
    onclick: (e) => { e.stopPropagation(); delFile(u, f); } }, icon('trash'));
  return h('div', { class: 'fcard', tabindex: 0, title: f.name,
    onclick: () => ready && viewFile(u, f), onkeydown: (e) => { if (e.key === 'Enter' && ready) viewFile(u, f); } },
    h('div', { class: 'thumb' },
      ...thumbBox(f),
      h('div', { class: 'shade' }),
      kind === 'video' && ready ? h('div', { class: 'play' }, icon('video')) : null,
      h('div', { class: 'ov tr' }, h('span', { class: 'pill st-' + (f.storage === 'do' ? 'cf' : f.storage) }, STORAGE[f.storage] || f.storage),
        !ready ? h('span', { class: 'pill ' + (f.status === 'failed' ? 'bad' : 'warn') }, f.status === 'failed' ? 'ناموفق' : 'در حال انتقال') : null),
      h('div', { class: 'ov bl' }, f.duration ? h('span', { class: 'pill ltr' }, dur(f.duration)) : null,
        splitName(f.name)[1] ? h('span', { class: 'pill' }, splitName(f.name)[1]) : null),
      del),
    h('div', { class: 'fbody' }, h('div', { class: 'fname', dir: 'auto' }, splitName(f.name)[0]),
      h('div', { class: 'fmeta' }, h('span', {}, size(f.size)), h('span', {}, date(f.created_at)))));
}

function viewFile(u, f) {
  const kind = KIND[f.kind] ? f.kind : 'file';
  let stage;
  if (f.url && kind === 'video') stage = h('video', { src: f.url, controls: true, autoplay: true, playsinline: true, preload: 'metadata', poster: f.thumb || null });
  else if (f.url && kind === 'image') stage = h('img', { src: f.url, alt: f.name, referrerpolicy: 'no-referrer' });
  else if (f.url && kind === 'audio') stage = h('audio', { src: f.url, controls: true, autoplay: true });
  else stage = h('div', { class: 'ph ' + kind }, icon(kind));
  const meta = [size(f.size), KIND[kind], f.width && f.height ? `${fa(f.width)}×${fa(f.height)}` : null, f.duration ? dur(f.duration) : null, date(f.created_at, true), STORAGE[f.storage]].filter(Boolean).join(' · ');
  const close = modal(h('div', { class: 'viewer', role: 'dialog', 'aria-modal': 'true' },
    h('div', { class: 'stage' }, stage),
    h('div', { class: 'info' },
      h('div', { class: 't' }, h('b', { dir: 'auto' }, f.name), h('span', { class: 'faint' }, meta)),
      f.url ? h('a', { class: 'btn', href: f.url, target: '_blank', rel: 'noopener noreferrer' }, icon('ext'), 'باز کردن') : null,
      h('button', { class: 'btn danger', onclick: () => delFile(u, f, () => close()) }, icon('trash'), 'حذف'),
      h('button', { class: 'btn', onclick: () => close() }, icon('x'), 'بستن'))),
    () => { if (stage.pause) stage.pause(); });
}

const FSORT = {
  new: (a, b) => b.created_at - a.created_at, old: (a, b) => a.created_at - b.created_at,
  big: (a, b) => b.size - a.size, small: (a, b) => a.size - b.size,
  name: (a, b) => a.name.localeCompare(b.name, 'fa'), long: (a, b) => (b.duration || 0) - (a.duration || 0),
};
function filesSection(u) {
  const counts = { all: u.files.length };
  for (const f of u.files) { const k = KIND[f.kind] ? f.kind : 'file'; counts[k] = (counts[k] || 0) + 1; }
  const list = u.files.filter((f) => state.fkind === 'all' || (KIND[f.kind] ? f.kind : 'file') === state.fkind).sort(FSORT[state.fsort] || FSORT.new);
  const chips = h('div', { class: 'chips' }, ...[['all', 'همه'], ['video', 'ویدیو'], ['image', 'تصویر'], ['audio', 'صوت'], ['file', 'فایل']]
    .filter(([k]) => k === 'all' || counts[k])
    .map(([k, t]) => h('button', { class: 'chip' + (state.fkind === k ? ' on' : ''), onclick: () => { state.fkind = k; renderUser(u); } }, t, h('span', { class: 'n' }, fa(counts[k] || 0)))));
  const sort = h('select', { class: 'in', 'aria-label': 'مرتب‌سازی فایل‌ها', onchange: (e) => { state.fsort = e.target.value; renderUser(u); } },
    ...[['new', 'جدیدترین'], ['old', 'قدیمی‌ترین'], ['big', 'بزرگ‌ترین'], ['small', 'کوچک‌ترین'], ['long', 'طولانی‌ترین'], ['name', 'نام']]
      .map(([v, t]) => h('option', { value: v, selected: state.fsort === v }, t)));
  return h('div', { class: 'card pad section' },
    h('h3', {}, 'فایل‌ها', h('span', { class: 'badge' }, `${fa(u.files.length)} فایل · ${size(u.files.reduce((a, f) => a + (f.size || 0), 0))}`)),
    u.files.length ? h('div', { class: 'ftools' }, chips, sort) : null,
    list.length ? h('div', { class: 'files' }, ...list.map((f) => fileCard(u, f)))
      : h('div', { class: 'empty' }, icon('folder'), 'فایلی نیست.'));
}

function renderUser(u) {
  current = u;
  const i = state.users.findIndex((x) => x.id === u.id);
  if (i >= 0) state.users[i] = { ...state.users[i], plan: u.plan, plan_title: u.plan_title, expires_at: u.expires_at, used: u.used, quota: u.quota,
    banned: u.banned, tv: !!u.tv, files: u.files.filter((f) => f.status === 'ready').length };
  const name = userName(u);
  const expired = u.expires_at && u.expires_at < Date.now();

  const actions = u.admin
    ? h('p', { class: 'muted' }, 'این حساب مدیر است و پلن و محدودیت ندارد.')
    : h('div', { class: 'acts' },
        h('div', { class: 'grp' }, h('span', {}, 'اشتراک فعلی'),
          h('div', { class: 'row' }, h('button', { class: 'btn primary', disabled: u.plan === 'free', title: u.plan === 'free' ? 'برای کاربر رایگان یک پلن انتخاب کنید' : null,
            onclick: () => act(u, 'ext', `اشتراک «${u.plan_title}» برای ${name} ۳۰ روز تمدید شود؟`) }, '＋ تمدید ۳۰ روز'))),
        h('div', { class: 'grp' }, h('span', {}, 'پلن جدید (۳۰ روز از امروز)'),
          h('div', { class: 'row' }, h('div', { class: 'seg' }, ...PLAN_ACTIONS.map(([p, t]) => h('button', { class: 'btn' + (u.plan === p ? ' on' : ''),
            onclick: () => act(u, p, `پلن ${name} به «${t}» برای ۳۰ روز از امروز تغییر کند؟ به کاربر پیام داده می‌شود.`) }, t))),
            h('button', { class: 'btn' + (u.plan === 'free' ? ' on' : ''), onclick: () => act(u, 'free', `پلن ${name} رایگان شود؟ (اشتراک فعلی تمام می‌شود)`, true) }, 'رایگان'))),
        h('div', { class: 'grp' }, h('span', {}, 'دسترسی'),
          h('div', { class: 'row' },
            u.banned ? h('button', { class: 'btn', onclick: () => act(u, 'unban', `مسدودی ${name} برداشته شود؟`) }, '✓ رفع مسدودی')
              : h('button', { class: 'btn danger', onclick: () => act(u, 'ban', `${name} مسدود شود؟`, true) }, 'مسدود کردن'),
            h('button', { class: 'btn danger', disabled: !u.tv, onclick: () => act(u, 'tvoff', `تلویزیون ${name} قطع شود؟`, true) }, 'قطع تلویزیون'))));

  const pays = u.payments.length
    ? h('div', { class: 'plist' }, ...u.payments.map((p) => h('div', { class: 'prow' },
        h('span', { class: 'badge ' + (PAY[p.status]?.[1] || '') }, PAY[p.status]?.[0] || p.status),
        h('span', {}, p.plan.replace(/^p/, '').replace('g', ' گیگ'), p.months > 1 ? ` · ${fa(p.months)} ماه` : ''),
        h('span', { class: 'faint' }, date(p.created_at, true)),
        h('span', { class: 'amt' }, fa(p.amount), ' تومان'))))
    : h('div', { class: 'faint' }, 'پرداختی ندارد.');

  $('#v-user').replaceChildren(
    backBtn(),
    h('div', { class: 'card pad hero' },
      avatar(u, true),
      h('div', { class: 'id' },
        h('h2', {}, name, planBadge(u), u.banned ? h('span', { class: 'badge bad' }, 'مسدود') : null, u.tv ? h('span', { class: 'badge cyan' }, 'تلویزیون وصل') : null),
        h('div', { class: 'faint' }, u.username ? h('span', { class: 'ltr' }, '@' + u.username) : null, u.username ? ' · ' : '', 'شناسه ', h('span', { class: 'ltr' }, String(u.id)))),
      h('div', { class: 'space' },
        h('div', { class: 'nums' }, h('span', {}, 'فضای مصرفی'), h('span', {}, `${size(u.used)} از ${size(u.quota)}`)), meter(u.used, u.quota))),
    h('div', { class: 'grid' },
      stat('پایان اشتراک', u.expires_at ? date(u.expires_at) : '—', expired ? h('span', { class: 'faint' }, ' (تمام شده)') : null),
      stat('تلویزیون', u.tv ? `از ${date(u.tv.since)}` : 'وصل نیست'),
      stat('عضویت', date(u.created_at)),
      stat('آخرین فعالیت', ago(u.last_seen || u.created_at)),
      stat('قوانین', u.terms_at ? `پذیرفته (${date(u.terms_at)})` : 'نپذیرفته'),
      u.referred_by ? stat('دعوت‌شده توسط', h('a', { href: '#/u/' + u.referred_by, class: 'ltr' }, String(u.referred_by))) : null),
    h('div', { class: 'card pad section' }, h('h3', {}, 'عملیات'), actions),
    filesSection(u),
    h('div', { class: 'card pad section' }, h('h3', {}, 'پرداخت‌ها', h('span', { class: 'badge' }, fa(u.payments.length))), pays),
  );
}

boot();
</script>
</body>
</html>
